</head><body><title>FakeTok</title>

<style>
/* Layout: pro editor. Desktop = library | player | details over a full-width multi-track timeline.
   Phone = player, timeline, active panel, bottom tab bar. Dark-only, neutral greys like a grading suite, one cyan accent. */
:root{
  --app:#0e0e10; --panel:#17171a; --panel2:#1d1d21; --raise:#242428; --hover:#2d2d32; --line:#29292e; --line2:#36363c;
  --fg:#ececf0; --dim:#9b9ba4; --faint:#64646d;
  --acc:#22d3e6; --acc-ink:#03181b; --acc-soft:rgba(34,211,230,.13); --acc-line:rgba(34,211,230,.55);
  --t-video:#1f3350; --t-text:#b9763b; --t-sticker:#a65e90; --t-media:#2b6788; --t-audio:#17614f; --t-fx:#6a4fd6; --t-filter:#2a8274; --t-beat:#ffd25a;
  --danger:#ff6b6b;
  --f-ui:"Inter","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--app);color:var(--fg);font:400 12.5px/1.4 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#34343a;border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
#app{height:100%;display:grid;grid-template-columns:minmax(330px,26vw) minmax(0,1fr) minmax(300px,23vw);grid-template-rows:40px minmax(0,1fr) minmax(230px,34vh);grid-template-areas:"top top top" "lib stage insp" "tl tl tl";gap:4px;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel{background:var(--panel);border-radius:8px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0;padding:0 2px}
.logo{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--f-ui);letter-spacing:-.01em;white-space:nowrap}
.logo .mark{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center}
.logo .mark svg{width:14px;height:14px;color:var(--acc-ink)}
.logo small{font-weight:500;color:var(--faint);font-size:11px;margin-left:2px}
.topmid{flex:1;display:flex;justify-content:center;min-width:0}
#projName{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:0;width:240px;text-align:center;font-weight:500;color:var(--dim)}
#projName:hover,#projName:focus{border-color:var(--line2);background:var(--panel);color:var(--fg)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--raise);border-radius:6px;padding:6px 11px;font-weight:600;white-space:nowrap;transition:background .12s,color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:#4fe0ef}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--raise)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg,.ib svg{width:16px;height:16px;flex:none}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--fg)}
.ib:hover{background:var(--raise)}
.ib.on{color:var(--acc)}
.ib[disabled]{opacity:.32;pointer-events:none}
/* library */
#lib{grid-area:lib}
#tabs{display:flex;gap:0;padding:4px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:6px 2px 7px;color:var(--dim);font-size:10.5px;font-weight:500;min-width:36px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{width:19px;height:19px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--acc)}
.tab.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;border-radius:2px;background:var(--acc)}
.tab.mobile-only{display:none}
.libwrap{flex:1;display:flex;min-height:0}
.libcats{width:96px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.libcats:empty{display:none}
.lc{border:0;background:transparent;text-align:left;border-radius:5px;padding:6px 8px;color:var(--dim);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc:hover{color:var(--fg);background:var(--panel2)}
.lc.on{color:var(--fg);background:var(--raise)}
.libbody{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:12px;min-width:0}
.libbody>*,.insp-b>*,.tool .body>*{flex-shrink:0}
.sec-h{font-size:12px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:8px}
.sec-h .spacer{flex:1}
.sec-h .hint{font-weight:400}
.hint{color:var(--dim);font-size:11.5px}
.drop{border:1px dashed var(--line2);border-radius:8px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--dim);background:var(--panel2);cursor:pointer}
.drop svg{width:26px;height:26px;color:var(--acc)}
.drop strong{color:var(--fg);font-weight:600;font-size:13px}
.drop.over,.drop:hover{border-color:var(--acc-line);background:var(--acc-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px 8px}
.card{position:relative;border:0;background:transparent;border-radius:6px;display:flex;flex-direction:column;text-align:left;padding:0;gap:5px;color:var(--dim)}
.card .thw{position:relative;border-radius:6px;overflow:hidden;background:var(--raise);aspect-ratio:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.card .thw>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .th{background:center/cover no-repeat}
.card:hover{color:var(--fg)}
.card:hover .thw{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.card.on{color:var(--acc)}
.card.on .thw{box-shadow:0 0 0 2px var(--acc)}
.card .nm{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1px}
.card .badge{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.66);border-radius:4px;padding:1px 5px;font:500 10px/1.5 var(--f-mono);color:#fff}
.card .add{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .12s,transform .12s;border:0;padding:0}
.card .add svg{width:13px;height:13px}
.card:hover .add,.card:focus-visible .add{opacity:1;transform:none}
.card .used{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.card .acts{display:flex;gap:4px}
.card .acts .btn{flex:1;padding:4px 0;font-size:11px}
.demo-note{background:var(--acc-soft);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg)}
.demo-note>div{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:4px}
.row-item{display:flex;align-items:center;gap:10px;border-radius:6px;padding:6px 8px;background:var(--panel2)}
.row-item:hover{background:var(--raise)}
.row-item .ico{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;background:var(--raise);flex:none;color:var(--acc)}
.row-item .ico svg{width:17px;height:17px}
.row-item .grow{flex:1;min-width:0}
.row-item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .t2{font-size:11px;color:var(--dim)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.emoji-grid button{aspect-ratio:1;font-size:27px;border:0;background:var(--panel2);border-radius:6px;line-height:1;transition:transform .12s}
.emoji-grid button:hover{background:var(--raise);transform:scale(1.08)}
.lbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.lbl-grid button{border:0;border-radius:6px;background:var(--panel2);padding:14px 6px;display:grid;place-items:center;min-height:62px}
.lbl-grid button:hover{background:var(--raise)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0 6px}.tpcard{border:0;background:var(--panel2);border-radius:8px;padding:0;overflow:hidden;color:#d9dbe3;cursor:pointer;text-align:center}.tpcard canvas{width:100%;display:block;aspect-ratio:16/9}.tpcard span{display:block;font-size:12px;font-weight:600;padding:5px 4px 7px}.tpcard.on{box-shadow:0 0 0 2px #fff}.tpcard:hover canvas{filter:brightness(1.15)}
details.adv{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}details.adv summary{cursor:pointer;font-size:13px;font-weight:600;color:#cfd2da;margin-bottom:8px}
.tpl{border:0;background:var(--panel2);border-radius:6px;padding:16px 6px;text-align:center;font-size:19px;line-height:1.1;overflow:hidden;white-space:nowrap;color:#fff;min-height:64px}
.tpl:hover{background:var(--raise)}
.tool{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:12px;text-align:left;background:var(--panel2)}
.tool .ico{width:34px;height:34px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.tool .ico svg{width:18px;height:18px}
.tool h4{margin:0 0 2px;font-size:13px;font-weight:600}
.tool p{margin:0;color:var(--dim);font-size:11.5px}
.tool .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
/* animation preview cards */
.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px 6px}
.acard{border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:11px;font-weight:500;text-align:center}
.acard .stage{aspect-ratio:1;border-radius:6px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.acard .box{width:46%;aspect-ratio:3/4;border-radius:3px;background:linear-gradient(160deg,#4fe0ef,#3a6fd8 60%,#7b4fe0);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.acard .box.txt{width:auto;aspect-ratio:auto;background:none;box-shadow:none;font:900 17px/1 var(--f-ui);color:#fff;letter-spacing:.02em}
.acard .none{width:40%;aspect-ratio:1;border-radius:50%;border:2px solid var(--faint);position:relative}
.acard .none::after{content:"";position:absolute;left:50%;top:-10%;bottom:-10%;width:2px;background:var(--faint);transform:rotate(45deg)}
.acard:hover{color:var(--fg)}
.acard:hover .stage{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.acard.on{color:var(--acc)}
.acard.on .stage{box-shadow:0 0 0 2px var(--acc)}
.acard .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .box.m{background:none;box-shadow:none;width:52%;aspect-ratio:3/4}
.acard .box,.acard .ch{animation:var(--a) var(--d,1.8s) linear infinite;animation-delay:var(--dl,0s);will-change:transform}
.acard .stage .ghost{position:absolute;animation:none!important;pointer-events:none}
.acard .stage .ghost.g1{opacity:.16}.acard .stage .ghost.g2{opacity:.3}
.acard:hover .box:not(.ghost),.acard.on .box:not(.ghost){animation-duration:calc(var(--d,1.8s) * .85)}
.acard .ch{display:inline-block}
.acard .stage{background:radial-gradient(120% 80% at 50% 115%,#2b3550 0,#1d1f27 60%)}
/* player */
#stage{grid-area:stage}
.ph{height:34px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);font-weight:600;color:var(--dim);gap:8px;flex:none}
.viewer{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:12px;background:#0b0b0d}
.canwrap{position:relative;line-height:0}
#view{display:block;width:100%;height:100%;background:#000;touch-action:none}
#selbox{position:absolute;left:0;top:0;border:1.5px solid #fff;pointer-events:none;transform-origin:50% 50%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#selbox .hd{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#fff;pointer-events:auto;cursor:nwse-resize;touch-action:none;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#selbox .hd svg{width:11px;height:11px;color:#111}
.stage-msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(14,14,16,.9);padding:6px 12px;border-radius:99px;font-size:12px;white-space:nowrap;z-index:3}
.transport{display:flex;align-items:center;gap:4px;padding:5px 10px;border-top:1px solid var(--line);flex:none}
.tc{font:500 12px/1 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc b{color:var(--acc);font-weight:500}
.play{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--fg);border:0;display:grid;place-items:center}
.play:hover{background:var(--raise)}
.play svg{width:20px;height:20px}
.chip-ratio{font:500 11.5px/1 var(--f-mono);color:var(--dim)}
/* inspector */
#insp{grid-area:insp}
.insp-h{height:34px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.insp-h h3{margin:0;font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--raise);color:var(--dim)}
.subtabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.subtab{border:0;background:transparent;padding:9px 8px 8px;font-size:12px;font-weight:500;color:var(--dim);white-space:nowrap;position:relative}
.subtab:hover{color:var(--fg)}
.subtab.on{color:var(--fg)}
.subtab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--acc)}
.insp-b{flex:1;overflow:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:14px}
.ctl{display:grid;grid-template-columns:84px minmax(0,1fr) 52px;align-items:center;gap:10px}
.ctl label{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl .val{background:var(--raise);border:0;border-radius:4px;padding:4px 6px;font:500 11.5px/1.2 var(--f-mono);text-align:center;color:var(--fg);font-variant-numeric:tabular-nums;width:100%;box-sizing:border-box;min-width:0}
.ctl.two{grid-template-columns:84px minmax(0,1fr)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--acc) 0 var(--p,50%),#3a3a40 var(--p,50%))}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#3a3a40}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4.5px;border:0;box-shadow:0 1px 3px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
select,input[type=text],input[type=number],textarea{background:var(--raise);border:1px solid transparent;border-radius:5px;padding:6px 8px;width:100%;box-sizing:border-box;min-width:0}
select:hover,input[type=text]:hover,textarea:hover{border-color:var(--line2)}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input[type=color]{width:100%;height:28px;border:0;border-radius:5px;background:var(--raise);padding:3px;cursor:pointer}
.seg{display:flex;background:var(--raise);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:4px;padding:5px 4px;font-size:12px;font-weight:500;color:var(--dim);white-space:nowrap}
.seg button.on{background:#3a3a41;color:var(--fg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.switch span{font-weight:600;font-size:12.5px}
.switch input{appearance:none;width:30px;height:17px;border-radius:99px;background:#3a3a40;position:relative;flex:none;cursor:pointer;margin:0;border:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#cfcfd4;transition:transform .15s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{transform:translateX(13px);background:#fff}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{border:0;background:var(--raise);border-radius:5px;padding:5px 9px;font-size:12px;font-weight:500;color:var(--dim)}
.pill:hover{color:var(--fg);background:var(--hover)}
.pill.on{background:var(--acc-soft);color:var(--acc)}
.group{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group-h{font-size:12.5px;font-weight:600;color:var(--fg)}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:24px 8px}
/* timeline */
#tl{grid-area:tl}
.tl-tools{display:flex;align-items:center;gap:1px;padding:3px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none;height:38px;box-sizing:border-box}
.tl-tools .sep{width:1px;height:18px;background:var(--line2);margin:0 6px;flex:none}
#zoom{width:110px;flex:none}
.tl-body{flex:1;overflow:auto;position:relative;scrollbar-color:#34343a transparent}
.tl-inner{position:relative;min-height:100%}
.ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--panel);cursor:ew-resize}
.tick{position:absolute;bottom:0;height:9px;border-left:1px solid #3c3c43;font:500 10px/1 var(--f-mono);color:var(--faint);padding:0 0 0 4px;box-sizing:border-box;white-space:nowrap}
.tick span{position:absolute;bottom:10px;left:-1px}
.tick.minor{height:4px}
.lane{position:relative;height:30px;margin:3px 0}
.lane.main{height:60px;margin:6px 0}
.lane.audio{height:34px}
.lane.adj{height:24px}
.lane-lbl{position:sticky;left:0;z-index:3;width:30px;height:100%;display:grid;place-items:center;background:var(--panel);color:var(--faint)}
.lane-lbl svg{width:14px;height:14px}
.lane-lbl button{border:0;background:transparent;color:inherit;padding:4px;border-radius:4px;display:grid;place-items:center}
.lane-lbl button:hover{color:var(--fg);background:var(--raise)}
.item{position:absolute;top:0;height:100%;border-radius:4px;box-sizing:border-box;overflow:hidden;cursor:grab;touch-action:none;display:flex;align-items:center;font-size:11px;font-weight:500;color:#fff;border:1.5px solid transparent;user-select:none;-webkit-user-select:none}
.item.sel{border-color:#fff;z-index:2}
.item .lbl{padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;position:relative;display:flex;align-items:center;gap:4px}
.item .lbl svg{width:12px;height:12px;flex:none}
.item.clip{background:var(--t-video) repeat-x left top/auto 72%;align-items:flex-start;flex-direction:column}
.item.clip .film{position:absolute;left:0;right:0;top:0;height:72%;background-repeat:repeat-x;background-size:auto 100%;pointer-events:none}
.item.clip .wav{position:absolute;left:0;right:0;bottom:0;height:28%;background:#14394a no-repeat left center;pointer-events:none;opacity:.95}
.item.clip .lbl{padding:3px 6px;font-size:10.5px;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);width:100%;box-sizing:border-box}
.item .tags{position:absolute;top:3px;right:5px;display:flex;gap:3px;pointer-events:none}
.item .tags span{background:rgba(0,0,0,.6);border-radius:3px;padding:0 4px;font:600 9.5px/1.5 var(--f-mono)}
.item.text{background:var(--t-text)} .item.sticker{background:var(--t-sticker)} .item.media{background:var(--t-media) repeat-x left center/auto 100%}
.item.audio{background:var(--t-audio) no-repeat}
.item.fx{background:var(--t-fx)} .item.filter{background:var(--t-filter)}
.hdl{position:absolute;top:0;bottom:0;width:9px;z-index:3;cursor:ew-resize;touch-action:none}
.hdl::after{content:"";position:absolute;top:25%;bottom:25%;left:3px;width:3px;border-radius:2px;background:#fff}
.hdl.l{left:0}.hdl.r{right:0}
.item:not(.sel) .hdl::after{opacity:0}
.item:hover .hdl::after{opacity:.8}
.tr-btn{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:5px;background:#e9e9ee;border:0;display:grid;place-items:center;z-index:4;padding:0;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.5);opacity:.85}
.tr-btn:hover{opacity:1}
.tr-btn svg{width:12px;height:12px}
.tr-btn.has{background:var(--acc);color:var(--acc-ink);opacity:1}
.tr-btn.sel{box-shadow:0 0 0 2px #fff}
#playhead{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:#fff;z-index:6;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-5px;width:11px;height:12px;background:#fff;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);border-radius:2px}
.beat{position:absolute;bottom:2px;width:3px;height:3px;background:var(--t-beat);border-radius:50%;pointer-events:none}
.add-lane{position:absolute;top:50%;transform:translateY(-50%);height:24px;border:0;border-radius:5px;background:var(--panel2);color:var(--dim);font-size:11.5px;font-weight:500;padding:0 10px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.add-lane svg{width:12px;height:12px}
.add-lane:hover{color:var(--fg);background:var(--raise)}
.lane.main .add-lane{height:44px;padding:0 16px;font-size:12.5px;color:var(--fg);background:var(--raise)}
.drag-ghost{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:7;pointer-events:none}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-h{padding:14px 14px 4px 18px;display:flex;align-items:center;gap:10px}
.modal-h h2{margin:0;font-size:15px;font-weight:700;flex:1}
.modal-b{padding:10px 18px 18px;display:flex;flex-direction:column;gap:12px}
.progress{height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.result-video{width:100%;max-height:300px;background:#000;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#f2f2f5;color:#111;font-weight:600;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.kbd{font:500 10.5px/1 var(--f-mono);background:var(--raise);border-radius:3px;padding:2px 5px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.acard .box,.acard .ch{animation:none!important}}

@media (max-width:880px){

  isDemo = false; sel = null; T = 0; syncElements(); touch(true); if (doCommit) commit();

  else el.volume = clamp(previewMuted ? 0 : v, 0, 1);

/* media elements per clip */

  const wantA = new Set();
  for (const a of S.audios) { wantA.add(a.id); if (!audioEls.has(a.id)) { const el = new Audio(media.get(a.mediaId).url); el.preload = 'auto'; audioEls.set(a.id, el); attachAudio(a.id, el); } }

  for (const c of S.clips) {
    if (c.type !== 'video') continue;
    const el = clipEls.get(c.id); if (!el) continue;
    const isAct = act.includes(c);
    const local = clamp(c.in + (t - c._start) * c.speed, c.in, Math.max(c.in, c.out - .02));
    // preload: park the next clip at its in-point
    if (!isAct && t < c._start && c._start - t < 1.2 && !playing) { }
    if (!isAct && t < c._start && c._start - t < 1.2 && el.readyState > 0 && Math.abs(el.currentTime - c.in) > .1 && !el.seeking) el.currentTime = c.in;
    syncMediaEl(el, local, c.speed, isAct);

    if (pair) v *= (c === pair[0] ? 1 - p : p);

    if (local > (media.get(c.mediaId).duration - .15)) continue;

  }

}

function getGenMedia(key) {
  if (genCacheM.has(key)) return genCacheM.get(key);
  const W = 540, H = 960, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  const draw = makeScene(key, W, H);
  const m = { id: uid(), type: 'image', name: GEN_SCENES.find(s => s.key === key).name, el: cv, w: W, h: H, duration: 4, lib: true, genKey: key, lastT: -1 };
  m.gen = t => { if (Math.abs(t - m.lastT) < 1e-4) return; m.lastT = t; g.save(); draw(g, t); g.restore(); };

}

/* =========================================================
   Demo project (animated sample scenes, clearly a sample)

async function loadDemo() {
  const tp = n => TEXT_PRESETS.find(p => p.name === n).p;
  const scenes = ['sunset', 'city', 'neon'], trans = [30, 29, 0], loops = ['dryf', 'unos', 'puls'], durs = [3.4, 3.4, 3.4];
  scenes.forEach((k, i) => { const m = getGenMedia(k); const c = newClip(m); c.out = durs[i]; c.trans = { type: trans[i], dur: .6 }; c.anim.loop = loops[i]; S.clips.push(c); });
  S.clips[0].anim.in = 'fade'; S.clips[0].anim.inDur = .8;
  layout();
  const t1 = newText(tp('Gradient')); t1.text = 'Mój pierwszy\nfilm'; t1.start = .3; t1.dur = 2.6; t1.y = .3; t1.size = 8.5; S.layers.push(t1);
  const t2 = newText(tp('Neon')); t2.text = 'Nocne miasto'; t2.start = 3.3; t2.dur = 2.4; t2.y = .7; t2.size = 7; S.layers.push(t2);
  const t3 = newText(tp('Glitch')); t3.text = 'FakeTok'; t3.start = 6.2; t3.dur = 2.8; t3.y = .5; t3.size = 8; S.layers.push(t3);
  const fx1 = newAdj('fx'); fx1.effect = { id: 26, amt: .9, speed: 1 }; fx1.start = S.clips[1]._start; fx1.dur = S.clips[1]._dur; S.adj.push(fx1);
  [0, .5, 1, 1.5, 2].forEach(o => { const A = newAdj('fx'); A.effect = { id: 53, amt: 1, speed: 1 }; A.start = S.clips[2]._start + .2 + o; A.dur = .45; S.adj.push(A); });

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') && !(e.target.type === 'range' && e.code === 'Space')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { if (sel) { e.preventDefault(); deleteSel(); } }
  else if (e.key.toLowerCase() === 's' && !mod) { splitAtPlayhead(); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); seek(T - (e.shiftKey ? 1 : 1 / S.settings.fps)); }
  else if (e.key === 'ArrowRight') { setPlaying(false); seek(T + (e.shiftKey ? 1 : 1 / S.settings.fps)); }
  else if (e.key === 'Home') seek(0); else if (e.key === 'End') seek(total);
  else if (e.key === 'Escape') { if (eyedrop) { eyedrop = null; $('#stageMsg').hidden = true; } else select(null); }
});

/* offline app: service worker, install button, desktop heartbeat */
(function standalone() {
  if (window.claude || window.KadrAndroid) return;
  const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  if (local && location.port) setInterval(() => fetch('/__alive', { cache: 'no-store' }).catch(() => { }), 4000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  let deferred = null; const btn = $('#installBtn');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener('appinstalled', () => { btn.hidden = true; toast('FakeTok zainstalowany'); });
  btn.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => { }); deferred = null; btn.hidden = true; });
})();
(async function boot() {

  renderTlTools(); renderLib(); renderInspector();
  layout(); renderTimeline();
  requestAnimationFrame(tick);
  await loadDemo();
  hist.stack = [snapshot()]; hist.idx = 0; updateUndo();
  window.__kadr = { get S() { return S; }, media, seek: t => seek(t), play: setPlaying, get T() { return T; }, get total() { return total; }, Seg, segLoad, select, renderFrame };
})();
