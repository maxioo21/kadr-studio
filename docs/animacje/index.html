<style>
/* Layout: template studio. Gallery (left) | live player (center) | edit panel (right); phone = player, panel, gallery.
   Dark-only like the FakeTok editor: neutral greys, one cyan accent. */
:root{
  --app:#0e0e10; --panel:#17171a; --panel2:#1e1e22; --raise:#26262b; --hover:#303036; --line:#2a2a2f; --line2:#3a3a41;
  --fg:#ececf0; --dim:#9c9ca6; --faint:#62626b;
  --acc:#22d3e6; --acc-ink:#03181b; --acc-soft:rgba(34,211,230,.13); --danger:#ff6b6b;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--app);color:var(--fg);font:400 13px/1.45 var(--f-ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#34343a;border-radius:10px;border:3px solid transparent;background-clip:content-box}
#app{height:100%;display:grid;grid-template-columns:minmax(300px,24vw) minmax(0,1fr) minmax(300px,24vw);grid-template-rows:48px minmax(0,1fr);grid-template-areas:"top top top" "gal stage edit";gap:6px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel{background:var(--panel);border-radius:10px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
header{grid-area:top;display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;white-space:nowrap}
.logo .mark{width:24px;height:24px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink)}
.logo .mark svg{width:15px;height:15px}
.logo small{font-weight:500;color:var(--dim);font-size:12px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--raise);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:5px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button.on{background:#3b3b43;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--raise);border-radius:7px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:#56e2f0}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:34px;height:34px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--raise)}
.ib svg{width:18px;height:18px}
/* gallery */
#gal{grid-area:gal}
.ph{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:700;flex:none}
.ph .hint{font-weight:400}
.cats{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;flex:none}
.cat{border:0;border-radius:99px;background:var(--raise);color:var(--dim);padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.cat.on{background:var(--fg);color:#111}
.glist{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.tcard{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--dim)}
.tcard .pv{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--raise);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.tcard canvas{width:100%;height:100%;display:block}
.tcard .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700}
.tcard .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px;font:500 10.5px/1.5 var(--f-mono)}
.tcard b{color:var(--fg);font-size:13px;font-weight:600}
.tcard span.d{font-size:11.5px;line-height:1.35}
.tcard:hover .pv{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tcard.on .pv{box-shadow:0 0 0 2px var(--acc)}
.tcard.on b{color:var(--acc)}
/* stage */
#stage{grid-area:stage}
.viewer{flex:1;min-height:0;display:grid;place-items:center;padding:14px;background:#0a0a0c;position:relative}
.canwrap{position:relative;line-height:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.canwrap.alpha{background:repeating-conic-gradient(#2b2b30 0 25%,#1f1f23 0 50%) 0 0/20px 20px}
#view{display:block;width:100%;height:100%}
.transport{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex:none}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--fg);color:#111;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px}
#scrub{flex:1;min-width:60px}
.tc{font:500 12px/1 var(--f-mono);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.tc b{color:var(--acc);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--acc) 0 var(--p,0%),#3a3a41 var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#3a3a41}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.toggle input{accent-color:var(--acc)}
/* edit panel */
#edit{grid-area:edit}
.ebody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{padding-top:16px;border-top:1px solid var(--line)}
.gh{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.gh .hint{font-weight:400}
.hint{color:var(--dim);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{color:var(--dim);font-size:12px;font-weight:500}
.field input[type=text],.field textarea,.field select{background:var(--raise);border:1px solid transparent;border-radius:7px;padding:8px 10px;width:100%;box-sizing:border-box}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:7px;padding:4px 8px 4px 4px}
.color input[type=color]{width:30px;height:26px;border:0;border-radius:5px;padding:0;background:transparent;cursor:pointer}
.color span{font:500 12px var(--f-mono);color:var(--dim)}
.skinbox{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:9px;padding:10px}
.skinbox canvas{width:96px;height:96px;image-rendering:pixelated;background:repeating-conic-gradient(#2b2b30 0 25%,#1f1f23 0 50%) 0 0/12px 12px;border-radius:6px;flex:none}
.skinbox .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
.err{color:var(--danger);font-size:12px}
.foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 14px 6px 18px}
.mh h2{margin:0;font-size:16px;flex:1}
.mb{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.progress{height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--acc)}
.result{width:100%;max-height:280px;border-radius:8px;background:#000}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#f2f2f5;color:#111;font-weight:600;padding:9px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  body{overflow:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100%}
  header{flex-wrap:wrap;height:auto;padding-block:4px}
  #stage{order:1;height:60vh;min-height:320px;flex:none}
  #gal{order:2;flex:none;max-height:none}
  #edit{order:3;flex:none}
  .glist{display:flex;overflow-x:auto;grid-template-columns:none}
  .glist .tcard{flex:0 0 160px}
  .ebody{overflow:visible}
}
</style>

<div id="app">
  <header>
    <div class="logo"><div class="mark" id="logoMark"></div>FakeTok Animacje <small>szablony do montażu</small></div>
    <div class="spacer"></div>
    <div class="seg" id="fmtSeg" role="group" aria-label="Format filmu"></div>
  </header>

  <section id="gal" class="panel" aria-label="Szablony">
    <div class="ph">Szablony <span class="spacer"></span><span class="hint" id="galCount"></span></div>
    <div class="cats" id="cats"></div>
    <div class="glist" id="glist"></div>
  </section>

  <section id="stage" class="panel" aria-label="Podgląd">
    <div class="ph"><span id="tplTitle">Podgląd</span><span class="spacer"></span><span class="hint" id="tplHint"></span></div>
    <div class="viewer" id="viewer">
      <div class="canwrap" id="canwrap"><canvas id="view" width="1280" height="720"></canvas></div>
      <div class="loading" id="loading">Ładuję silnik 3D…</div>
    </div>
    <div class="transport">
      <button class="play" id="playBtn" title="Odtwórz / pauza (spacja)" aria-label="Odtwórz lub zatrzymaj"></button>
      <span class="tc"><b id="tNow">0.0</b> / <span id="tDur">0.0</span> s</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Przewijanie">
      <label class="toggle"><input type="checkbox" id="loopChk" checked> Pętla</label>
      <label class="toggle"><input type="checkbox" id="soundChk" checked> Dźwięk</label>
    </div>
  </section>

  <section id="edit" class="panel" aria-label="Edycja">
    <div class="ph">Edytuj szablon</div>
    <div class="ebody" id="ebody"></div>
    <div class="foot">
      <button class="btn primary block" id="exportBtn"></button>
      <button class="btn block" id="pngBtn">Zapisz klatkę jako PNG</button>
    </div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="skinIn" accept="image/png" hidden>
<input type="file" id="bgIn" accept="image/*" hidden>

/* ================= playback ================= */

/* ================= export ================= */
let downloads = null;
(async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; } })();

}
const fileBase = () => (ST.tpl.name + ' ' + ST.fmt.replace(':', 'x')).replace(/[^\p{L}\p{N} _-]+/gu, '').trim().replace(/\s+/g, '-');
$('#pngBtn').addEventListener('click', async () => {
  const [W, H] = FORMATS[ST.fmt].map(x => x * 1.5);
  const c = document.createElement('canvas'); c.width = W; c.height = H; renderTo(c.getContext('2d'), W, H, ST.t);

});
function pickMime() { const c = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']; return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || ''; }

      h('div', { class: 'field' }, h('label', null, 'Klatki na sekundę'), h('div', { class: 'seg' }, ...[[30, '30'], [60, '60']].map(([r, l]) => h('button', { class: fps === r ? 'on' : '', onclick: () => { fps = r; draw(); } }, l)))),
      h('div', { class: 'hint' }, `${W} × ${H} px · ${(durOf(ST.tpl) / ST.speed).toFixed(1)} s · ${ext.toUpperCase()} · ${ST.sound ? 'z dźwiękiem' : 'bez dźwięku'} · tło: ${(BGS.find(b => b[0] === (ST.bg === 'none' ? 'green' : ST.bg)) || [])[1]}`),

function runExport(W, H, fps, mime, ext, body, bg) {
